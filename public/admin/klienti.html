<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Všichni klienti – Sella</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/vendor/fonts/fonts.css">
  <link rel="stylesheet" href="/sella/sella.css">
  <!-- Our own overview (operator only): every client at a glance, their logins, and a way into each one's analytics. -->
  <style>
    .wrap { width: min(1180px, 100% - 48px); margin: 0 auto; }
    header { display: flex; align-items: center; gap: 16px; padding: 22px 0 10px; flex-wrap: wrap; }
    header .wordmark { font-size: 34px; text-decoration: none; }
    header .tools { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    header .btn { height: 42px; padding: 0 18px; font-size: 14.5px; }
    .intro { display: flex; align-items: end; justify-content: space-between; gap: 24px; flex-wrap: wrap; margin: 46px 0 28px; }
    .intro h1 { font: 400 clamp(40px, 5.5vw, 64px)/1.05 var(--serif); margin: 0; letter-spacing: -.015em; }
    .intro h1 em { color: var(--accent); }
    .sums { display: flex; gap: 12px; flex-wrap: wrap; }
    .sum { padding: 14px 18px; min-width: 150px; }
    .sum .k { font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; }
    .sum .v { font: 400 30px/1.15 var(--serif); margin-top: 4px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 520px), 1fr)); gap: 18px; padding-bottom: 60px; }
    .client { padding: 24px; display: flex; flex-direction: column; gap: 18px; }
    .client .head { display: flex; align-items: center; gap: 14px; }
    .client .mono { width: 52px; height: 52px; border-radius: 16px; flex: none; display: grid; place-items: center; font: 400 28px/1 var(--serif); color: #fff; background: var(--tint, linear-gradient(140deg, #6f9ccf, #3d68a6)); }
    .client h2 { font: 400 28px/1.1 var(--serif); margin: 0; }
    .client .meta { font-size: 13.5px; color: var(--ink-3); }
    .chip { margin-left: auto; align-self: start; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 99px; background: rgba(47, 138, 93, .14); color: #2f7a55; }
    .chip.off { background: rgba(192, 84, 75, .14); color: #a3433a; }
    .chip.wait { background: rgba(183, 122, 29, .16); color: #8a5a12; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .stat { background: rgba(255, 255, 255, .55); border-radius: 16px; padding: 12px 14px; min-width: 0; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .8); }
    .stat .k { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stat .v { font: 400 26px/1.2 var(--serif); margin-top: 4px; }
    .stat .s { font-size: 12px; color: var(--ink-3); }
    .meter { height: 6px; border-radius: 6px; background: rgba(47, 49, 51, .08); margin-top: 8px; overflow: hidden; }
    .meter i { display: block; height: 100%; border-radius: inherit; background: #4e7fb4; }
    .login { background: rgba(255, 255, 255, .45); border-radius: 18px; padding: 14px 16px; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: center; font-size: 14.5px; }
    .login .k { color: var(--ink-3); font-size: 13px; }
    .login code { font: 500 14.5px "Geist Mono", ui-monospace, monospace; letter-spacing: .02em; }
    .login .pw { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .login .pw .note { font-size: 12.5px; color: var(--ink-3); width: 100%; }
    .login .pw .new { color: #2f7a55; }
    .mini { border: 0; background: rgba(255, 255, 255, .7); color: var(--ink); font: 500 13px var(--sans); padding: 6px 11px; border-radius: 99px; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .9); }
    .mini:hover { background: #fff; }
    .mini:disabled { opacity: .5; cursor: default; }
    .err { color: #a3433a; font-size: 13px; width: 100%; }
    .client .go { display: flex; gap: 10px; flex-wrap: wrap; }
    .client .go .btn { height: 46px; padding: 0 22px; font-size: 15px; }
    .empty { padding: 40px; text-align: center; color: var(--ink-3); }
    .warn { padding: 14px 18px; margin-bottom: 18px; font-size: 14.5px; color: var(--ink-2); }
    @media (max-width: 620px) {
      .wrap { width: calc(100% - 32px); }
      .stats { grid-template-columns: 1fr 1fr; }
      .client { padding: 18px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="wordmark" href="/admin/klienti.html" title="Všichni klienti">Sella</a>
      <div class="tools">
        <span id="lang"></span>
        <a class="btn light" href="/admin/clients.html" data-i18n="manage">Správa klientů</a>
        <button class="btn light" id="logout" data-i18n="logout">Odhlásit</button>
      </div>
    </header>

    <section class="intro rv">
      <div>
        <p class="eyebrow" id="month"></p>
        <h1 data-i18n-html="h1">Všichni <em>klienti</em></h1>
      </div>
      <div class="sums" id="sums"></div>
    </section>

    <p class="pane warn" id="nodb" hidden data-i18n="nodb"></p>
    <div class="grid" id="grid"><p class="pane empty" data-i18n="loading">Načítám…</p></div>
  </div>

  <script src="/sella/i18n.js"></script>
  <script src="/sella/sella.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    const I = SellaI18n;
    const t = I.use({
      cs: {
        title: "Všichni klienti – Sella", manage: "Správa klientů", logout: "Odhlásit", h1: "Všichni <em>klienti</em>", loading: "Načítám…",
        month: (m) => `Přehled · ${m}`, clients: "Klienti", aiMsgs: "Zprávy od AI", cost: "Náklad AI",
        active: "aktivní", inactive: "neaktivní", unpaid: "čeká na platbu", canceled: "předplatné skončilo", pastDue: "platba selhala", paidCard: "platí kartou", demo: "naše ukázka", off: "bot vypnutý – limit tarifu",
        visits: "Návštěvy", used: "Využilo AI", questions: "Dotazy", plan: "Tarif", of: (a, b) => `${a} z ${b}`, days: (d) => `za ${d} dní`,
        login: "Přihlášení", id: "ID", pw: "Heslo",
        pwDemo: "Úvodní heslo ukázky – platí, dokud nevytvoříte nové.", pwSet: "nastaveno (uložen jen otisk)", pwNone: "zatím nemá",
        pwNew: "Nové heslo – zobrazí se jen teď. Staré přestalo platit.", show: "Ukázat", hide: "Skrýt", copy: "Kopírovat", copied: "Zkopírováno",
        gen: "Vytvořit nové heslo", genConfirm: (n) => `${n} už heslo má. Vytvořit nové? Staré přestane platit.`, copyAccess: "Kopírovat přístup pro majitele",
        open: "Otevřít analýzu", noData: "Data se nepodařilo načíst.",
        nodb: "Bez databáze nejde ukládat nová hesla na serveru. Ukázkové obchody mají úvodní heslo odvozené z ADMIN_TOKEN – funguje i tak.",
        access: (name, id, url, pw) => `Dobrý den,\n\npřehled AI prodavačky pro ${name} najdete tady:\n${url}\n\nID obchodu: ${id}\nHeslo: ${pw}\n\nHeslo si prosím uložte do správce hesel.`,
        empty: "Zatím žádní klienti.",
      },
      en: {
        title: "All clients – Sella", manage: "Manage clients", logout: "Sign out", h1: "All <em>clients</em>", loading: "Loading…",
        month: (m) => `Overview · ${m}`, clients: "Clients", aiMsgs: "AI messages", cost: "AI cost",
        active: "active", inactive: "inactive", unpaid: "waiting for payment", canceled: "subscription ended", pastDue: "payment failed", paidCard: "pays by card", demo: "our demo", off: "bot off – plan limit",
        visits: "Visits", used: "Used AI", questions: "Questions", plan: "Plan", of: (a, b) => `${a} of ${b}`, days: (d) => `last ${d} days`,
        login: "Login", id: "ID", pw: "Password",
        pwDemo: "The demo's starting password – valid until you create a new one.", pwSet: "set (only a hash is stored)", pwNone: "none yet",
        pwNew: "New password – shown only now. The old one no longer works.", show: "Show", hide: "Hide", copy: "Copy", copied: "Copied",
        gen: "Create a new password", genConfirm: (n) => `${n} already has a password. Create a new one? The old one will stop working.`, copyAccess: "Copy access for the owner",
        open: "Open analytics", noData: "Couldn't load the data.",
        nodb: "Without a database, new passwords can't be stored on the server. The demo shops have a starting password derived from ADMIN_TOKEN – that works regardless.",
        access: (name, id, url, pw) => `Hello,\n\nyou'll find the AI assistant insights for ${name} here:\n${url}\n\nShop ID: ${id}\nPassword: ${pw}\n\nPlease keep the password in a password manager.`,
        empty: "No clients yet.",
      },
    });
    I.switcher($("lang"));
    const nf = (n) => Number(n || 0).toLocaleString(I.locale());

    let data = null, stats = {}, revealed = {}, fresh = {};
    const TINTS = ["linear-gradient(140deg,#3b4a8f,#1d2558)", "linear-gradient(140deg,#c58a57,#8a5530)", "linear-gradient(140deg,#6f9ccf,#3d68a6)", "linear-gradient(140deg,#5d9a85,#2f6553)", "linear-gradient(140deg,#9a7bc8,#5b438c)"];

    async function load() {
      const r = await fetch("/api/admin/clients");
      if (r.status === 401) return location.replace(`/sella/prihlaseni.html?client=admin&next=${encodeURIComponent("/admin/klienti.html")}`);
      if (r.status === 403) return location.replace("/admin/");
      if (!r.ok) { $("grid").innerHTML = `<p class="pane empty">${t("noData")}</p>`; return; }
      data = await r.json();
      render();
      // each client's own numbers, side by side
      await Promise.all(data.clients.map(async (c) => {
        const a = await fetch(`/api/analytics?client=${encodeURIComponent(c.id)}`).then((x) => (x.ok ? x.json() : null)).catch(() => null);
        if (a) stats[c.id] = { sessions: a.totals.sessions, aiSessions: a.totals.aiSessions, questions: a.totals.userMessages, days: a.periodDays };
        render();
      }));
    }

    function render() {
      if (!data) return;
      document.title = t("title");
      const month = new Date(data.month + "-01").toLocaleDateString(I.locale(), { month: "long", year: "numeric" });
      $("month").textContent = t("month", month);
      $("nodb").hidden = data.database;
      const totalMsgs = data.clients.reduce((s, c) => s + c.usage.messages, 0), totalCost = data.clients.reduce((s, c) => s + c.usage.costUsd, 0);
      $("sums").innerHTML = [[t("clients"), nf(data.clients.length)], [t("aiMsgs"), nf(totalMsgs)], [t("cost"), "$" + totalCost.toFixed(2)]]
        .map(([k, v]) => `<div class="pane sum"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");
      if (!data.clients.length) { $("grid").innerHTML = `<p class="pane empty">${t("empty")}</p>`; return; }
      $("grid").innerHTML = data.clients.map((c, i) => {
        const s = stats[c.id];
        const share = c.limits.messages ? Math.min(c.usage.messages / c.limits.messages, 1) : 0;
        const pw = fresh[c.id]
          ? `<code>${esc(fresh[c.id])}</code><button class="mini" data-copy="${esc(fresh[c.id])}">${t("copy")}</button><span class="note new">${t("pwNew")}</span>`
          : c.demoPassword
            ? `<code>${revealed[c.id] ? esc(c.demoPassword) : "••••-••••-••••"}</code><button class="mini" data-reveal="${esc(c.id)}">${revealed[c.id] ? t("hide") : t("show")}</button><button class="mini" data-copy="${esc(c.demoPassword)}">${t("copy")}</button><span class="note">${t("pwDemo")}</span>`
            : `<span>${c.hasPassword ? t("pwSet") : t("pwNone")}</span>`;
        const access = fresh[c.id] || c.demoPassword;
        // the shop's state: waiting for its first payment, payment trouble, over its limit, or running
        const stateChip = (c) => c.billing === "unpaid" ? `<span class="chip wait">${t("unpaid")}</span>`
          : c.billing === "canceled" && !c.active ? `<span class="chip off">${t("canceled")}</span>`
          : !c.active ? `<span class="chip off">${t("inactive")}</span>`
          : c.billing === "past_due" ? `<span class="chip wait">${t("pastDue")}</span>`
          : c.usage.messages >= c.limits.messages ? `<span class="chip off">${t("off")}</span>`
          : `<span class="chip">${t("active")}${c.billing === "active" ? ` · ${t("paidCard")}` : ""}</span>`;
        return `<article class="pane client">
          <div class="head">
            <span class="mono" style="--tint:${TINTS[i % TINTS.length]}">${esc(c.name.slice(0, 1))}</span>
            <div style="min-width:0"><h2>${esc(c.name)}</h2><div class="meta">${esc(c.id)} · ${esc(c.domains.join(", ") || t("demo"))}</div></div>
            ${stateChip(c)}
          </div>
          <div class="stats">
            <div class="stat"><div class="k">${t("visits")}</div><div class="v">${s ? nf(s.sessions) : "–"}</div><div class="s">${s ? t("days", s.days) : "&nbsp;"}</div></div>
            <div class="stat"><div class="k">${t("used")}</div><div class="v">${s && s.sessions ? Math.round((s.aiSessions / s.sessions) * 100) + " %" : "–"}</div><div class="s">${s ? t("of", nf(s.aiSessions), nf(s.sessions)) : "&nbsp;"}</div></div>
            <div class="stat"><div class="k">${t("questions")}</div><div class="v">${s ? nf(s.questions) : "–"}</div><div class="s">&nbsp;</div></div>
            <div class="stat"><div class="k">${t("plan")} · ${esc(I.plan(c.limits.planName))}</div><div class="v">${nf(c.usage.messages)}</div><div class="s">/ ${nf(c.limits.messages)}</div><div class="meter"><i style="width:${share * 100}%;${share >= 1 ? "background:#c0544b" : share >= 0.8 ? "background:#a8721c" : ""}"></i></div></div>
          </div>
          <div class="login">
            <span class="k">${t("id")}</span><code>${esc(c.id)}</code>
            <span class="k">${t("pw")}</span><div class="pw">${pw}</div>
            <span></span><div class="pw"><button class="mini" data-gen="${esc(c.id)}">${t("gen")}</button>${access ? `<button class="mini" data-access="${esc(c.id)}">${t("copyAccess")}</button>` : ""}<span class="err" id="err-${esc(c.id)}"></span></div>
          </div>
          <div class="go"><a class="btn dark" href="/admin/?client=${encodeURIComponent(c.id)}">${t("open")} <span class="arr">→</span></a></div>
        </article>`;
      }).join("");
    }

    const flash = (btn) => { const was = btn.textContent; btn.textContent = t("copied") + " ✓"; setTimeout(() => { btn.textContent = was; }, 1400); };
    $("grid").onclick = async (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      if (b.dataset.reveal) { revealed[b.dataset.reveal] = !revealed[b.dataset.reveal]; render(); }
      else if (b.dataset.copy) { await navigator.clipboard.writeText(b.dataset.copy); flash(b); }
      else if (b.dataset.access) {
        const c = data.clients.find((x) => x.id === b.dataset.access);
        const url = `${location.origin}/sella/prihlaseni.html?client=${encodeURIComponent(c.id)}`;
        await navigator.clipboard.writeText(t("access", c.name, c.id, url, fresh[c.id] || c.demoPassword));
        flash(b);
      } else if (b.dataset.gen) {
        const c = data.clients.find((x) => x.id === b.dataset.gen);
        if (c.hasPassword && !confirm(t("genConfirm", c.name))) return;
        b.disabled = true;
        const r = await fetch(`/api/admin/clients/${encodeURIComponent(c.id)}/password`, { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) { b.disabled = false; $("err-" + c.id).textContent = d.error || t("noData"); return; }
        fresh[c.id] = d.password;
        c.hasPassword = true; c.demoPassword = null;
        render();
      }
    };
    $("logout").onclick = async () => { await fetch("/api/admin/logout", { method: "POST" }); location.href = "/sella/prihlaseni.html"; };
    I.onChange(render);
    load();
  </script>
</body>
</html>
