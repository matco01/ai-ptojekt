<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Přihlášení – Sella</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/vendor/fonts/fonts.css">
  <link rel="stylesheet" href="sella.css">
  <style>
    body { min-height: 100svh; display: grid; grid-template-rows: auto 1fr auto; }
    .top { display: flex; justify-content: space-between; align-items: center; padding: 22px clamp(16px, 4vw, 40px); }
    .top a { text-decoration: none; font-size: 14.5px; color: var(--ink-2); }
    .top a:hover { color: var(--ink); }
    main { display: grid; place-items: center; padding: 20px 16px 40px; }
    .stack { width: min(420px, 100%); text-align: center; }
    .stack > .wordmark { font-size: clamp(92px, 16vw, 132px); margin-bottom: 26px; }
    .stack > .wordmark span { display: inline-block; opacity: 0; transform: translateY(.15em); filter: blur(8px); animation: letter 1.1s cubic-bezier(.2, .8, .2, 1) forwards; }
    @keyframes letter { to { opacity: 1; transform: none; filter: none; } }

    /* "both" holds the start state only during the delay – so the shake on a wrong password can replace it safely */
    form.pane { padding: 30px 28px 26px; text-align: left; animation: rise .9s .45s cubic-bezier(.2, .8, .2, 1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } }
    form h1 { font: 400 26px/1.2 var(--serif); margin: 0 0 4px; }
    form .sub { margin: 0 0 22px; color: var(--ink-3); font-size: 14.5px; }
    .field { position: relative; margin-bottom: 14px; }
    .field input { width: 100%; height: 56px; padding: 20px 18px 4px; border: 0; border-radius: 16px; font: 400 16px var(--sans); color: var(--ink);
      background: rgba(255, 255, 255, .62); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .8); transition: box-shadow .2s, background .2s; }
    .field input:focus { outline: none; background: rgba(255, 255, 255, .85); box-shadow: inset 0 0 0 1.5px var(--accent), 0 0 0 4px rgba(78, 127, 180, .14); }
    .field label { position: absolute; left: 18px; top: 18px; font-size: 16px; color: var(--ink-3); pointer-events: none; transform-origin: left top; transition: transform .2s, color .2s; }
    .field input:focus + label, .field input:not(:placeholder-shown) + label { transform: translateY(-11px) scale(.76); color: var(--ink-2); }
    .field .peek { position: absolute; right: 8px; top: 8px; height: 40px; padding: 0 12px; border: 0; border-radius: 12px; background: none; color: var(--ink-3); font: 500 13px var(--sans); cursor: pointer; }
    .field .peek:hover { color: var(--ink); background: rgba(255, 255, 255, .5); }
    .err { min-height: 22px; margin: 2px 2px 10px; color: #a3433a; font-size: 14px; }
    form.shake { animation: shake .45s; }
    @keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
    form .btn { width: 100%; }
    form .btn[disabled] { opacity: .6; cursor: default; transform: none; }
    .help a { color: var(--ink); text-underline-offset: 3px; }
    .help { margin: 18px 0 0; text-align: center; font-size: 13.5px; color: var(--ink-3); }
    footer { text-align: center; padding: 0 16px 26px; font-size: 13px; color: var(--ink-3); }
    footer a { text-decoration: none; } footer a:hover { color: var(--ink); }

    body.leaving main { transition: opacity .5s, transform .5s, filter .5s; opacity: 0; transform: scale(.98); filter: blur(6px); }
  </style>
</head>
<body>
  <div class="top">
    <a href="/" data-i18n="back">← Zpět na Sellu</a>
    <span id="lang"></span>
  </div>

  <main>
    <div class="stack">
      <p class="wordmark" aria-hidden="true"><span style="animation-delay:.05s">S</span><span style="animation-delay:.12s">e</span><span style="animation-delay:.19s">l</span><span style="animation-delay:.26s">l</span><span style="animation-delay:.33s">a</span></p>
      <form class="pane" id="form" novalidate>
        <h1 data-i18n="h1">Přehled vašeho obchodu</h1>
        <p class="sub" data-i18n="sub">Co dělá vaše prodavačka a co hledají vaši zákazníci.</p>
        <div class="field">
          <input id="client" name="client" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder=" " required>
          <label for="client" data-i18n="id">E-mail nebo ID obchodu</label>
        </div>
        <div class="field">
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder=" " required>
          <label for="password" data-i18n="pw">Heslo</label>
          <button class="peek" type="button" id="peek" data-i18n="show" data-i18n-attr="aria-label=showLabel">Ukázat</button>
        </div>
        <p class="err" id="err" role="alert"></p>
        <button class="btn dark" type="submit" id="go"><span data-i18n="go">Přihlásit se</span> <span class="arr">→</span></button>
        <p class="help" data-i18n="help">Zapomněli jste heslo? Napište nám a pošleme vám nové.</p>
        <p class="help" data-i18n-html="new">Ještě nemáte účet? <a href="/sella/registrace.html">Chci Sellu</a></p>
      </form>
    </div>
  </main>

  <footer><a href="/podminky.html" data-i18n="terms_link">Obchodní podmínky</a> · <a href="/zpracovani-udaju.html" data-i18n="dpa_link">Zpracování údajů</a> · <a href="/soukromi.html" data-i18n="privacy">Ochrana soukromí</a> · © 2026 Sella<br><span data-op="line"></span></footer>

  <script src="i18n.js"></script>
  <script src="/legal/provozovatel.js"></script>
  <script src="sella.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const I = SellaI18n;
    const t = I.use({
      cs: {
        title: "Přihlášení – Sella", back: "← Zpět na Sellu", h1: "Přehled vašeho obchodu", sub: "Co dělá vaše prodavačka a co hledají vaši zákazníci.",
        id: "E-mail nebo ID obchodu", pw: "Heslo", new: "Ještě nemáte účet? <a href=\"/sella/registrace.html\">Chci Sellu</a>", show: "Ukázat", hide: "Skrýt", showLabel: "Zobrazit heslo", hideLabel: "Skrýt heslo", go: "Přihlásit se",
        help: "Zapomněli jste heslo? Napište nám a pošleme vám nové.", privacy: "Ochrana soukromí", terms_link: "Obchodní podmínky", dpa_link: "Zpracování údajů",
        empty: "Vyplňte prosím e-mail (nebo ID obchodu) i heslo.", bad: "Nesprávný e-mail, ID obchodu nebo heslo.", many: "Příliš mnoho pokusů, zkuste to za 15 minut.",
        failed: "Přihlášení se nepodařilo.", offline: "Spojení se nezdařilo, zkuste to prosím znovu.",
      },
      en: {
        title: "Sign in – Sella", back: "← Back to Sella", h1: "Your shop's insights", sub: "What your assistant does and what your customers look for.",
        id: "E-mail or shop ID", pw: "Password", new: "No account yet? <a href=\"/sella/registrace.html\">Get Sella</a>", show: "Show", hide: "Hide", showLabel: "Show password", hideLabel: "Hide password", go: "Sign in",
        help: "Forgot your password? Write to us and we'll send you a new one.", privacy: "Privacy", terms_link: "Terms", dpa_link: "Data processing",
        empty: "Please fill in your e-mail (or shop ID) and password.", bad: "Wrong e-mail, shop ID or password.", many: "Too many attempts, please try again in 15 minutes.",
        failed: "Signing in didn't work.", offline: "Couldn't connect, please try again.",
      },
    });
    const retitle = () => { document.title = t("title"); };
    retitle(); I.onChange(retitle);
    I.switcher($("lang"));

    const params = new URLSearchParams(location.search);
    // only our own dashboards are valid places to continue to
    const asked = /^\/admin\/[\w./?=&#%-]*$/.test(params.get("next") || "") ? params.get("next") : null;
    // shop owners land on their overview, we land on the list of all clients
    const home = (me) => asked || (me?.master ? "/admin/klienti.html" : "/admin/");
    if (params.get("client")) $("client").value = params.get("client");
    ($("client").value ? $("password") : $("client")).focus();

    // already signed in → straight on (not for the open local dev mode)
    fetch("/api/admin/me").then((r) => (r.ok ? r.json() : null)).then((me) => { if (me && !me.dev) location.replace(home(me)); }).catch(() => {});

    $("peek").onclick = () => {
      const show = $("password").type === "password";
      $("password").type = show ? "text" : "password";
      $("peek").dataset.i18n = show ? "hide" : "show";
      $("peek").dataset.i18nAttr = `aria-label=${show ? "hideLabel" : "showLabel"}`;
      I.apply($("form"));
    };

    const fail = (msg) => {
      $("err").textContent = msg;
      $("form").classList.remove("shake"); void $("form").offsetWidth; $("form").classList.add("shake");
    };
    $("form").onsubmit = async (e) => {
      e.preventDefault();
      $("err").textContent = "";
      const client = $("client").value.trim(), password = $("password").value;
      if (!client || !password) return fail(t("empty"));
      $("go").disabled = true;
      try {
        const r = await fetch("/api/admin/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ client, password }) });
        if (!r.ok) throw new Error(r.status === 401 ? t("bad") : r.status === 429 ? t("many") : t("failed"));
        const me = await fetch("/api/admin/me").then((x) => x.json()).catch(() => ({}));
        document.body.classList.add("leaving");
        setTimeout(() => location.assign(home(me)), Sella.reduced ? 0 : 420);
      } catch (err) {
        fail(err instanceof TypeError ? t("offline") : err.message);
        $("password").select();
        $("go").disabled = false;
      }
    };
  </script>
</body>
</html>
