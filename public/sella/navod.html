  $("eh").textContent = T.endH; $("eline").textContent = T.endLine; $("ecta").textContent = T.endCta; $("ewhere").textContent = T.endWhere;

  // ---- timing helpers (as in film.html)
  const clamp = (x) => Math.max(0, Math.min(1, x));

  // ---- what happens inside each system's admin, in seconds from the start of its scene

  function plan(p) {

  // scene lengths: long enough for the action and to read (or hear) the caption

  const read = (n) => (T.caps[n] ? T.caps[n].length / 14 + 1.4 : 0);

  let acc = 0;

  const DURATION = acc;
  const sceneAt = (t) => { const i = NAMES.findIndex((n, k) => t >= S[n] && t < (S[NAMES[k + 1]] ?? DURATION + 99)); return i < 0 ? NAMES.length - 1 : i; };
  const next = (n) => S[NAMES[NAMES.indexOf(n) + 1]] ?? DURATION;

  const stageXY = (el) => { let x = 0, y = 0; while (el && el.id !== "stage") { x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent; } return [x, y]; };

  // a cursor that moves between timed points: [[time, x, y], …]

  // the admin window shows one system at a time; it is rebuilt only when the system changes

    set($("bubble"), bv, `scale(${0.6 + 0.4 * out((u5 - 2.2) / 0.5)})`);

    const bvis = on(t, S.bot1, S.data - 0.3, 0.7, 0.5);

    if (bvis > 0) {

      const color = b1 > B1.color ? COLORS[2] : COLORS[0];

      // Manner

      $("bret").textContent = T.retText;
      const dropped = b3 > B3.drop;
      $("bdrop").classList.toggle("hot", b3 > B3.grab + 0.6 && !dropped);
      $("bdocs").innerHTML = dropped ? `<span class="doc"><i>PDF</i>${esc(T.doc)}</span>` : "";
      $("bsave").classList.toggle("press", pressed(b3, B3.save));
      $("bsaved").textContent = b3 > B3.save + 0.3 ? T.savedBot : "";
      $("bsaved").style.opacity = out((b3 - B3.save - 0.3) / 0.3);
      // the preview follows the settings live
      const shownName = nm || T.oldName;
      $("pvchat").style.setProperty("--ac", color);
      $("pvmas").innerHTML = mascotSvg(SHAPE_IDS[shape], color, 38, Math.sin(t * 1.3) * 1.5);
      $("pvlaunch").innerHTML = mascotSvg(SHAPE_IDS[shape], color, 58, Math.sin(t * 1.3) * 1.5);
      $("pvname").textContent = shownName;
      $("pvmsg").textContent = tone === 0 ? T.pvFriendly.replace(T.newName, shownName) : T.pvGreet;
      $("pvmsg").style.transform = tone === 0 && b2 - B2.tone < 0.35 ? `scale(${0.96 + 0.04 * out((b2 - B2.tone) / 0.35)})` : "";
      // the cursor through all three tabs
      if (name === "bot1") {
        const pts = [[0, 640, 640], [B1.name, ...mid($("bname"), 0.25)], [B1.color, ...mid($("sw2"))], [B1.shape, ...mid($("sh2"), 0.3)]];
        cur = path(pts, b1); cv = on(t, S.bot1 + 0.5, S.bot2, 0.3, 0.2);
        click = [B1.name, B1.color, B1.shape].some((a) => pressed(b1, a));
      } else if (name === "bot2") {
        const pts = [[0, ...mid($("sh2"), 0.3)], [B2.tab, ...mid($("tab1"))], [B2.tone, ...mid($("tone0"), 0.4)], [B2.area, ...mid($("binstr"), 0.2, 0.3)]];
        cur = path(pts, b2); cv = on(t, S.bot2 - 0.2, S.bot3, 0.2, 0.2);
        click = [B2.tab, B2.tone, B2.area].some((a) => pressed(b2, a));
      } else if (name === "bot3") {
        const doc = mid($("bdrop"));
        const pts = [[0, ...mid($("binstr"), 0.2, 0.3)], [B3.tab, ...mid($("tab2"))], [B3.ship, ...mid($("bship"), 0.2)], [B3.grab, 1150, 520], [B3.drop, doc[0] + 40, doc[1]], [B3.save, ...mid($("bsave"))]];
        cur = path(pts, b3); cv = on(t, S.bot3 - 0.2, S.data - 0.4, 0.2, 0.3);
        click = [B3.tab, B3.ship, B3.grab, B3.save].some((a) => pressed(b3, a));
        // the document travels with the cursor while it is dragged
        const dragging = b3 > B3.grab && b3 < B3.drop;
        set($("dragdoc"), dragging ? out((b3 - B3.grab) / 0.25) : 0, `translate(${cur[0] + 12}px, ${cur[1] + 10}px) rotate(-4deg)`);
      }
    }
    if (name !== "bot3") set($("dragdoc"), 0);

    // step 6 · the overview fills with data
    const ud = t - S.data;
    const dv = on(t, S.data, S.end - 0.3, 0.7, 0.5);
    set($("data"), dv, `translateY(${(1 - dv) * 26}px)`);
    const g = io((ud - 0.8) / 2.6);
    const vals = [Math.round(214 * g), Math.round(18 * g) + " %", Math.round(57 * g), Math.round(9 * g)];
    vals.forEach((v, i) => { $("kv" + i).textContent = v; });
    T.qs.forEach((_, i) => { const k = out((ud - 2.2 - i * 0.7) / 0.5); $("q" + i).style.opacity = k; $("q" + i).style.transform = `translateX(${(1 - k) * -16}px)`; });
    const d6 = on(t, S.data + 4.4, S.end - 0.3, 0.5, 0.5);
    set($("done6"), d6, `translateY(${(1 - d6) * 14}px)`);

    // we'll do it for you
    const ev = on(t, S.end, DURATION + 5, 0.9, 0.1);
    set($("end"), ev, `translateY(${(1 - ev) * 20}px)`);
    $("ecta").style.transform = `scale(${1 + 0.035 * Math.sin(Math.max(0, t - S.end - 2) * 3.2) * (t > S.end + 2 ? 1 : 0)})`;

    set($("cursor"), cur ? cv : 0, cur ? `translate(${cur[0]}px, ${cur[1]}px) scale(${click ? 0.85 : 1})` : "");
    set($("keys"), keys, `translate(${keysAt[0]}px, ${keysAt[1] + (1 - keys) * 10}px)`);

    // captions
    const capText = T.caps[name] || "";
    if ($("cap").dataset.i !== String(si)) { $("cap").textContent = capText; $("cap").dataset.i = si; }
    const capv = capText ? on(t, S[name] + 0.35, next(name) - 0.1, 0.4, 0.3) : 0;
    set($("cap"), capv, `translateY(${(1 - capv) * 10}px)`);

    $("progress").style.width = (t / DURATION) * 100 + "%";
    $("progress").style.opacity = params.has("rec") ? 0 : 1;
  }

  const fit = () => { const k = Math.min(innerWidth / 1280, innerHeight / 720); $("stage").style.transform = `scale(${k})`; };
  addEventListener("resize", fit); fit();

  window.__duration = DURATION;
  window.__names = NAMES;
  window.__scenes = NAMES.map((n) => S[n]);
  // the narration: one line per scene (the caption, or a spoken version where it has code in it)
  window.__voice = NAMES.map((n) => T.voice[n] || T.caps[n] || "");
  window.__render = render;
  window.__ready = document.fonts.ready.then(() => true);
  if (!params.has("rec")) {
    let t0 = null;
    const loop = (now) => { t0 ??= now; render(((now - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
    window.__ready.then(() => requestAnimationFrame(loop));
  } else render(0);
</script>
</body>
</html>
