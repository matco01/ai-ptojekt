        shoptet: { name: "Shoptet", sub: "admin", url: "your-shop.com/admin", ic: "S", color: "#2c8a6e",
          menu: ["Overview", "Orders", "Products", "Customers", "Appearance & content", "Editor", "HTML code", "Settings"], path: [4, 5, 6], nested: [5, 6],
          h: "HTML code", field: "Footer", save: "Save" },
        wordpress: { name: "WordPress", sub: "dashboard", url: "your-shop.com/wp-admin", ic: "W", color: "#2b5d86",
          menu: ["Dashboard", "Posts", "WooCommerce", "Products", "Code Snippets", "Header & Footer", "Plugins", "Settings"], path: [4, 5], nested: [5],
          h: "Header & Footer", field: "Footer", save: "Save Changes" },
        shopify: { name: "Shopify", sub: "admin", url: "admin.shopify.com", ic: "S", color: "#3d6b3a",
          menu: ["Home", "Orders", "Products", "Customers", "Online Store", "Themes", "Edit code", "Settings"], path: [4, 5, 6], nested: [5, 6],
          h: "theme.liquid", file: "layout/theme.liquid", save: "Save" },
        gtm: { name: "Tag Manager", sub: "workspace", url: "tagmanager.google.com", ic: "G", color: "#3b6fd1",
          menu: ["Overview", "Tags", "New", "Custom HTML", "Triggers", "Variables", "Folders", "Templates"], path: [1, 2, 3], nested: [2, 3],
          h: "Custom HTML – Sella", field: "HTML", trigger: "Trigger: All Pages", save: "Save", submit: "Submit" },
        other: { name: "Your website", sub: "template editor", url: "your-shop.com", ic: "</>", color: "#55595e",
          menu: ["Pages", "Template", "Footer", "Media", "Settings"], path: [1, 2], nested: [2],
          h: "Website template", file: "template · footer", save: "Save" },
      },
    },
  }[LANG];
  document.documentElement.lang = LANG;
  document.title = LANG === "en" ? "Sella – how to add the code to your website" : "Sella – jak vložit kód na web";
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[<>&]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" })[c]);
  // the code coloured, cut to the first `n` characters (it "types" or "pastes" in)
  const codeHtml = (n = Infinity) => {
    let left = n, html = "";
    for (const [cls, text] of CODE(T.shopId)) {
      if (left <= 0) break;
      const part = esc(text.slice(0, left)); left -= text.length;
      html += cls ? `<span class="${cls}">${part}</span>` : part;
    }
    return html;
  };

  // ---- static content
  $("th").textContent = T.th; $("ttag").textContent = T.tag;
  $("csec").innerHTML = `${esc(T.sec)}<small>${esc(T.secSub)}</small>`;
  $("ch").textContent = T.cardH; $("chint").textContent = T.cardHint; $("csnip").innerHTML = codeHtml();
  $("pickh").textContent = T.pickH;
  const PLATFORMS = ["shoptet", "wordpress", "shopify", "gtm", "other"];
  const tileName = { shoptet: "Shoptet", wordpress: "WordPress", shopify: "Shopify", gtm: "Tag Manager", other: T.other };
  const tileSub = { shoptet: "", wordpress: "WooCommerce", shopify: "", gtm: "Google", other: T.otherSub };
  $("tiles").innerHTML = PLATFORMS.map((p) => `<div class="tile" id="tile-${p}"><span class="ic" style="background:${T.P[p].color}">${esc(T.P[p].ic)}</span><b>${esc(tileName[p])}</b><small>${esc(tileSub[p]) || "&nbsp;"}</small></div>`).join("");
  $("surl").textContent = T.shop; $("slogo").textContent = T.shopLogo;
  $("bwho").textContent = T.who; $("bb1").textContent = T.b1; $("bb2").textContent = T.b2; $("ok").textContent = T.ok;
  $("eh").textContent = T.endH; $("eline").textContent = T.endLine; $("ecta").textContent = T.endCta; $("ewhere").textContent = T.endWhere;

  // Sella's own little character (what a shop without a logo of its own gets)
  $("mascot").innerHTML = `<svg width="78" height="78" viewBox="0 0 100 100"><defs><linearGradient id="mg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fb3d8"/><stop offset="1" stop-color="#3d68a6"/></linearGradient></defs>
    <ellipse cx="50" cy="101" rx="36" ry="3.4" fill="rgba(15,24,73,.16)"/><rect x="5" y="5" width="90" height="90" rx="30" fill="url(#mg)"/>
    <path d="M14 30 Q15 15 30 12" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="34" cy="46" r="11" fill="#fff"/><circle cx="66" cy="46" r="11" fill="#fff"/>
    <g class="pupils"><circle cx="36" cy="47" r="6.5" fill="#1d2a45"/><circle cx="68" cy="47" r="6.5" fill="#1d2a45"/></g>
    <path d="M37 67 Q50 76 63 67" fill="none" stroke="#1d2a45" stroke-width="3.6" stroke-linecap="round"/></svg>`;

  // ---- timing helpers (as in film.html)
  const clamp = (x) => Math.max(0, Math.min(1, x));
  const out = (x) => 1 - Math.pow(1 - clamp(x), 3);
  const io = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
  const lerp = (a, b, k) => a + (b - a) * k;
  const on = (t, a, b, fi = 0.6, fo = 0.6) => Math.min(out((t - a) / fi), out((b - t) / fo));
  const type = (text, t, a, cps = 38) => text.slice(0, Math.max(0, Math.floor((t - a) * cps)));
  const set = (el, op, tf = "") => { el.style.opacity = op; el.style.transform = tf; el.style.visibility = op > 0.001 ? "visible" : "hidden"; };

  // ---- what happens inside each system's admin, in seconds from the start of its scene
  const STEP = 0.95;
  function plan(p) {
    const P = T.P[p];
    const clickAt = P.path.map((_, i) => 0.9 + i * STEP);
    const focusAt = clickAt.at(-1) + 1.1;      // click into the field / onto the </body> line
    const pasteAt = focusAt + 0.7;              // Ctrl+V
    const trigAt = P.trigger ? pasteAt + 1.2 : null;
    const saveAt = (trigAt ?? pasteAt) + 1.5;   // click Save
    const submitAt = P.submit ? saveAt + 1.3 : null;
    return { clickAt, focusAt, pasteAt, trigAt, saveAt, submitAt, done: (submitAt ?? saveAt) + 1.6 };
  }
  const PLANS = Object.fromEntries(PLATFORMS.map((p) => [p, plan(p)]));

  // scene lengths: long enough for the action and to read the subtitle (≈ 14 characters a second)
  const NAMES = ["title", "copy", "pick", ...PLATFORMS, "check", "end"];
  const read = (n) => (T.caps[n] ? T.caps[n].length / 14 + 1.4 : 0);
  const MIN = { title: 5, copy: 7, pick: 7.5, check: 8, end: 9 };
  const S = {};
  let acc = 0;
  for (const n of NAMES) { S[n] = acc; acc += Math.max(MIN[n] ?? 0, PLANS[n]?.done ?? 0, read(n)); }
  S.len = acc;
  const DURATION = S.len;
  const sceneAt = (t) => { let i = NAMES.findIndex((n, k) => t >= S[n] && t < (S[NAMES[k + 1]] ?? DURATION + 99)); return i < 0 ? NAMES.length - 1 : i; };

  // position of an element on the stage (offsets ignore the stage's scaling)
  const stageXY = (el) => { let x = 0, y = 0; while (el && el.id !== "stage") { x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent; } return [x, y]; };

  // the admin window shows one system at a time; it is rebuilt only when the system changes
  let shown = null, geo = null;
  function buildAdmin(p) {
    const P = T.P[p];
    $("win").style.setProperty("--pc", P.color);
    $("wurl").textContent = P.url; $("wic").textContent = P.ic; $("wname").textContent = P.name; $("wsub").textContent = P.sub;
    $("side").innerHTML = P.menu.map((m, i) => `<div class="mi${P.nested.includes(i) ? " sub" : ""}" id="mi${i}">${esc(m)}</div>`).join("");
    $("wh").textContent = P.h;
    const editor = Boolean(P.file);
    $("wbody").innerHTML = editor
      ? `<div class="lbl">${esc(P.file)}</div><div class="ed" id="ed"></div><span class="save" id="save">${esc(P.save)}</span><span class="saved" id="saved">✓ ${esc(T.saved)}</span>`
      : `<div class="lbl">${esc(P.field)}</div><div class="field" id="field"></div>${P.trigger ? `<div class="trig" id="trig"><i>✓</i>${esc(P.trigger)}</div>` : ""}<span class="save" id="save">${esc(P.save)}</span>${P.submit ? ` <span class="save" id="submit" style="margin-left:10px">${esc(P.submit)}</span>` : ""}<span class="saved" id="saved">✓ ${esc(T.saved)}</span>`;
    // where the cursor goes: the menu items, the field (or the </body> line), Save and Submit
    renderEditor(false, false);
    const mid = (el, dx = 0.5, dy = 0.5) => { const [x, y] = stageXY(el); return [x + el.offsetWidth * dx, y + el.offsetHeight * dy]; };
    geo = {
      items: P.path.map((i) => mid($("mi" + i), 0.35)),
      field: editor ? mid($("ed").querySelector(".body"), 0.3) : mid($("field"), 0.3, 0.3),
      trig: P.trigger ? mid($("trig"), 0.3) : null,
      save: mid($("save")), submit: P.submit ? mid($("submit")) : null,
    };
    shown = p;
  }
  // a theme file: the code lands on its own line just above </body>
  function renderEditor(pasted, mark) {
    if (!$("ed")) return;
    const lines = [
      ["", '<span class="t">&lt;footer</span> <span class="a">class</span>=<span class="s">"site-footer"</span><span class="t">&gt;</span>'],
      ["", '  {{ footer_menu }}'],
      ["", '<span class="t">&lt;/footer&gt;</span>'],
      ...(pasted ? [["new", codeHtml()]] : []),
      [`body${mark ? " mark" : ""}`, "&lt;/body&gt;"],
      ["", '<span class="t">&lt;/html&gt;</span>'],
    ];
    $("ed").innerHTML = lines.map(([cls, html], i) => `<div class="ln ${cls}"><u>${41 + i}</u><span style="white-space:pre-wrap">${html}</span></div>`).join("");
  }

  // cursor path within an admin scene
  function adminCursor(p, u) {
    const pl = PLANS[p];
    const pts = [[0, 820, 520], ...pl.clickAt.map((a, i) => [a, ...geo.items[i]]), [pl.focusAt, ...geo.field]];
    if (pl.trigAt) pts.push([pl.trigAt, ...geo.trig]);
    pts.push([pl.saveAt, ...geo.save]);
    if (pl.submitAt) pts.push([pl.submitAt, ...geo.submit]);
    let i = pts.findIndex((q) => q[0] > u);
    if (i === 0) return pts[0].slice(1);
    if (i < 0) return pts.at(-1).slice(1);
    const [t0, x0, y0] = pts[i - 1], [t1, x1, y1] = pts[i];
    const k = io((u - t0 - 0.0) / Math.max(0.3, (t1 - t0) * 0.8));
    return [lerp(x0, x1, k), lerp(y0, y1, k)];
  }
  const pressed = (u, at) => at != null && u > at && u < at + 0.22;

  function render(t) {
    $("c1").style.transform = `translate(${Math.sin(t / 9) * 40}px, ${Math.cos(t / 11) * 30}px)`;
    $("c2").style.transform = `translate(${Math.sin(t / 9) * 44}px, ${Math.cos(t / 11) * 34}px)`;
    $("c3").style.transform = `translate(${Math.cos(t / 7) * 30}px, ${Math.sin(t / 8) * 20}px)`;
    let cur = null, cv = 0, click = false, keys = 0, keysAt = [0, 0];

    // 1 · title
    const tv = on(t, S.title, S.copy - 0.3, 0.9, 0.8);
    set($("title"), tv, `translateY(${(1 - tv) * 24}px)`);

    // 2 · copy the code in the overview
    const u2 = t - S.copy;
    const kv = on(t, S.copy, S.pick - 0.3, 0.7, 0.5);
    set($("copy"), kv, `translateY(${(1 - kv) * 30}px)`);
    const copied = u2 > 3.4;
    $("copybtn").textContent = copied ? T.copied : T.copy; $("copybtn").classList.toggle("done", copied);
    $("copybtn").style.transform = pressed(u2, 3.3) ? "scale(.96)" : "";
    if (t >= S.copy && t < S.pick) {
      const [bx, by] = stageXY($("copybtn"));
      const k = io((u2 - 1.2) / 1.8);
      cur = [lerp(820, bx + 60, k), lerp(600, by + 24, k)]; cv = on(t, S.copy + 0.9, S.pick - 0.5, 0.4, 0.4); click = pressed(u2, 3.3);
    }

    // 3 · which system
    const u3 = t - S.pick;
    const pv = on(t, S.pick, S[PLATFORMS[0]] - 0.3, 0.7, 0.5);
    set($("pick"), pv, `translateY(${(1 - pv) * 30}px)`);
    PLATFORMS.forEach((p, i) => {
      const k = out((u3 - 0.4 - i * 0.12) / 0.6);
      const el = $("tile-" + p);
      el.style.opacity = k; el.style.transform = `translateY(${(1 - k) * 20}px)`;
      const hot = u3 > 2.2 + i * 0.9 && u3 < 2.2 + (i + 1) * 0.9;
      el.classList.toggle("hot", hot);
    });

    // 4 · in each system's admin
    const si = sceneAt(t), name = NAMES[si];
    const wv = on(t, S[PLATFORMS[0]], S.check - 0.3, 0.7, 0.5);
    set($("win"), wv, `translateY(${(1 - wv) * 36}px) scale(${0.97 + 0.03 * wv})`);
    if (PLATFORMS.includes(name)) {
      if (shown !== name) buildAdmin(name);
      const P = T.P[name], pl = PLANS[name], u = t - S[name];
      // the system changes: its contents fade in
      const fade = out(u / 0.45);
      $("main").style.opacity = fade; $("side").style.opacity = fade;
      P.menu.forEach((_, i) => {
        const step = P.path.indexOf(i);
        const el = $("mi" + i);
        el.classList.toggle("on", step >= 0 && u > pl.clickAt[step] + 0.1);
        el.style.opacity = P.nested.includes(i) && step > 0 && u < pl.clickAt[step - 1] + 0.1 ? 0.35 : 1;
      });
      $("crumb").innerHTML = P.path.filter((_, k) => u > pl.clickAt[k] + 0.1).map((i, k, a) => (k === a.length - 1 ? `<b>${esc(P.menu[i])}</b>` : esc(P.menu[i]))).join(" › ");
      $("wh").style.opacity = u > pl.clickAt.at(-1) + 0.2 ? 1 : 0;
      $("wbody").style.opacity = out((u - pl.clickAt.at(-1) - 0.25) / 0.4);
      const pasted = u > pl.pasteAt + 0.15;
      if ($("ed")) renderEditor(pasted, u > pl.focusAt && !pasted);
      else {
        $("field").classList.toggle("focus", u > pl.focusAt && u < pl.saveAt);
        $("field").innerHTML = pasted ? codeHtml() : u > pl.focusAt && Math.floor(t * 2) % 2 ? "|" : "";
        if ($("trig")) $("trig").style.opacity = pl.trigAt != null ? out((u - pl.trigAt) / 0.35) : 1;
      }
      $("save").classList.toggle("press", pressed(u, pl.saveAt));
      if ($("submit")) $("submit").classList.toggle("press", pressed(u, pl.submitAt));
      $("saved").style.opacity = out((u - (pl.submitAt ?? pl.saveAt) - 0.25) / 0.3);
      cur = adminCursor(name, u); cv = on(t, S[name] + 0.4, S[NAMES[si + 1]] - 0.3, 0.3, 0.3);
      click = pl.clickAt.some((a) => pressed(u, a)) || pressed(u, pl.focusAt) || pressed(u, pl.trigAt) || pressed(u, pl.saveAt) || pressed(u, pl.submitAt);
      keys = on(u, pl.pasteAt - 0.15, pl.pasteAt + 0.9, 0.15, 0.25); keysAt = [geo.field[0] + 30, geo.field[1] - 70];
    }

    // 5 · it works
    const u5 = t - S.check;
    const sv = on(t, S.check, S.end - 0.3, 0.8, 0.6);
    set($("shop"), sv, `translateY(${(1 - sv) * 36}px)`);
    const hopK = clamp((u5 - 1) / 0.9);
    const mx = lerp(1180, 1030, hopK), my = lerp(640, 500, hopK) - 150 * 4 * hopK * (1 - hopK);
    const land = clamp((u5 - 1.9) / 0.5), sq = u5 > 1.9 ? 1 - 0.18 * Math.exp(-6 * land) * Math.cos(land * 9) : 1;
    set($("mascot"), on(t, S.check + 1, S.end - 0.3, 0.3, 0.5), `translate(${mx}px, ${my}px) scale(${2 - sq}, ${sq})`);
    const bv = on(t, S.check + 2.2, S.end - 0.3, 0.5, 0.5);
    set($("bubble"), bv, `scale(${0.6 + 0.4 * out((u5 - 2.2) / 0.5)})`);
    $("btext").textContent = type(T.greet, t, S.check + 2.5, 45);
    const okv = on(t, S.check + 4.2, S.end - 0.3, 0.5, 0.5);
    set($("ok"), okv, `translateY(${(1 - okv) * 14}px)`);
    $("mascot").querySelectorAll(".pupils").forEach((p) => { p.style.transform = `translate(${-2 + Math.sin(t * 1.3) * 1.5}px, ${-1}px)`; });

    // 6 · we'll do it for you
    const ev = on(t, S.end, DURATION + 5, 0.9, 0.1);
    set($("end"), ev, `translateY(${(1 - ev) * 20}px)`);
    $("ecta").style.transform = `scale(${1 + 0.035 * Math.sin(Math.max(0, t - S.end - 2) * 3.2) * (t > S.end + 2 ? 1 : 0)})`;

    // the cursor and the paste shortcut
    set($("cursor"), cur ? cv : 0, cur ? `translate(${cur[0]}px, ${cur[1]}px) scale(${click ? 0.85 : 1})` : "");
    set($("keys"), keys, `translate(${keysAt[0]}px, ${keysAt[1] + (1 - keys) * 10}px)`);

    // subtitles
    const capText = T.caps[name] || "";
    if ($("cap").dataset.i !== String(si)) { $("cap").textContent = capText; $("cap").dataset.i = si; }
    const nextStart = S[NAMES[si + 1]] ?? DURATION + 1;
    const capv = capText ? on(t, S[name] + 0.35, nextStart - 0.1, 0.4, 0.3) : 0;
    set($("cap"), capv, `translateY(${(1 - capv) * 10}px)`);

    $("progress").style.width = (t / DURATION) * 100 + "%";
    $("progress").style.opacity = params.has("rec") ? 0 : 1;
  }

  const fit = () => { const k = Math.min(innerWidth / 1280, innerHeight / 720); $("stage").style.transform = `scale(${k})`; };
  addEventListener("resize", fit); fit();

  window.__duration = DURATION;
  window.__scenes = NAMES.map((n) => S[n]);
  window.__render = render;
  window.__ready = document.fonts.ready.then(() => true);
  if (!params.has("rec")) {
    let t0 = null;
    const loop = (now) => { t0 ??= now; render(((now - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
    window.__ready.then(() => requestAnimationFrame(loop));
  } else render(0);
</script>
</body>
</html>
